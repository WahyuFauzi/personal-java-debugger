name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish standalone bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build launcher
        run: ./mvnw -pl com.neozpir.jdl -am package -U

      - name: Bundle runtime
        run: |
          set -euo pipefail
          DIST=com.neozpir.jdl/build/java-debug
          test -f "$DIST/server-launcher.jar"
          ls "$DIST"/com.microsoft.java.debug.core-*.jar
          cd "$DIST"
          zip -r "$GITHUB_WORKSPACE/java-debug-standalone.zip" \
            server-launcher.jar \
            com.microsoft.java.debug.core-*.jar \
            lib
          unzip -l "$GITHUB_WORKSPACE/java-debug-standalone.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="$GITHUB_WORKSPACE/java-debug-standalone.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "java-debug standalone $tag" \
              --generate-notes
          fi
